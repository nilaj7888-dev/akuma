services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: akuma
      POSTGRES_PASSWORD: akuma
      POSTGRES_DB: akuma
    ports:
      - "5432:5432"
    volumes:
      - akuma-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akuma -d akuma"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - akuma-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  akuma-postgres:
  akuma-redis:
